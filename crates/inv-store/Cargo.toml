[package]
name = "inv-store"
edition.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
inv-model = { workspace = true }
inv-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
fs4 = { version = "0.13", features = ["sync"] }

# Backend adapter deps. Declared now so later agents only touch the module files
# (src/postgres.rs, src/gsheet.rs); the current stubs do not use them.
postgres = "0.19"
r2d2 = { version = "0.8", optional = true }
r2d2_postgres = { version = "0.18", optional = true }
# Runtime-free blocking HTTP client for the Google Sheets transport. Unlike
# `reqwest::blocking` (which spins up its own internal tokio runtime and panics
# when that runtime is dropped inside the gateway's `spawn_blocking` context),
# `ureq` does pure blocking I/O with no internal async runtime, so it is safe to
# call from within tokio's blocking pool.
ureq = { version = "2", features = ["json"] }
# CSV parsing for reading published / link-shared ("public URL") Google Sheets,
# which export as CSV. Declared now so the next agent only edits src/gsheet.rs.
csv = "1"

[dev-dependencies]
tempfile = "3"
proptest = { workspace = true }
