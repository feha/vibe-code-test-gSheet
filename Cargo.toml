[workspace]
resolver = "2"
members = [
    "crates/inv-model",
    "crates/inv-core",
    "crates/inv-store",
    "crates/inv-crypto",
    "crates/inv-server",
    "crates/inv-app",
]
# The tested set is the model + core + store + the gateway server. inv-crypto is
# obsolete (zero-knowledge blob-store era) and kept out of default-members; the
# model change may break its compile and that is intentional.
default-members = [
    "crates/inv-model",
    "crates/inv-core",
    "crates/inv-store",
    "crates/inv-server",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
inv-model = { path = "crates/inv-model" }
inv-core = { path = "crates/inv-core" }
inv-store = { path = "crates/inv-store" }
inv-crypto = { path = "crates/inv-crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
proptest = "1"
